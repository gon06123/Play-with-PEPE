<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner Test</title>
    <!-- 억울한 페페의 출근길 : 달리기 게임 테스트 (사이트 본체와 상관없이 이 파일만 열어서 확인)
         조작 : 스페이스 / ↑ / 화면 클릭 = 점프
         규칙 : 장애물에 부딪히면 멘탈(하트) 1칸 감소 · 3칸 다 없어지면 끝 -->
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;700&family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #008080 url(images/background.jpg) center / cover; }

        /* 테스트용 : 창을 화면 가운데 고정 (사이트에선 script.js 가 위치를 잡아줌) */
        #win-runner {
            display: flex;
            width: 60rem;
            height: auto;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
        }
        #win-runner .title-bar { background: var(--title); }

        .window-body.runner {
            padding: 0;
            overflow: hidden;
            line-height: 0;
        }
        #runner-canvas {
            display: block;
            width: 100%;
            aspect-ratio: 2 / 1;
            image-rendering: pixelated;
            cursor: pointer;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div class="window open active" id="win-runner">
        <div class="title-bar"><span class="title-text">Pepe Run</span></div>
        <div class="window-body runner">
            <canvas id="runner-canvas" width="600" height="300"></canvas>
        </div>
    </div>

<script>
(() => {
'use strict';

/* ▼ 픽셀 그림 : 글자 하나 = 픽셀 한 칸 (. = 빈칸) · 색은 COLORS */
const COLORS = {
    D: '#3d6e28',   // 진한 초록 (테두리)
    G: '#5b9a3c',   // 초록 (얼굴)
    W: '#ffffff',   // 눈 흰자
    B: '#111111',   // 눈동자
    M: '#b5652d',   // 입 (갈색)
    R: '#e0004a',   // 입술 빨강
    P: '#f2a0b4',   // 혀 분홍
    U: '#1546e8',   // 옷 파랑
    V: '#0a2aa8',   // 옷 진한 파랑
    T: '#6ec6ff',   // 눈물
    Y: '#ffd83d',   // 바나나 노랑
    O: '#b88a1a',   // 바나나 갈색
    A: '#4a8fd8',   // 웅덩이 파랑
    L: '#9fd0ff',   // 웅덩이 반짝
    C: '#ff7a1a',   // 꼬깔 주황
    E: '#ffffff',   // 꼬깔 흰 줄
    H: '#e00000',   // 하트
    K: '#4a4a4a',   // 쓰레기통 테두리 · 꼬깔 받침
    S: '#a7adb3',   // 쓰레기통 회색
    N: '#7d848a',   // 쓰레기통 줄무늬
};

// 페페 얼굴 : 하트가 줄수록 다음 얼굴로 바뀌고 그대로 유지됨 (점점 일그러짐)
//   [0] 멀쩡 → [1] 시무룩 (눈꺼풀 내려오고 입 꾹) → [2] 울먹 (눈물 한 방울 · 입꼬리 내려감) → [3] 엉엉 (눈 질끈 · 눈물 줄줄 · 입 벌림)
const FACES = [
    [
        '....DDDD.DDDD...',
        '...DGGGGDGGGGD..',
        '..DGGWWWGWWWGD..',
        '..DGWWWBBWWBBD..',
        '..DGWWWBBWWBBD..',
        '.DGGGWWWGWWWGGD.',
        '.DGGGGGGGGGGGGD.',
        '.DGGMMMMMMMMMMD.',
        '..DGGMRPPPPRMD..',
        '...DGGMMMMMMD...',
    ],
    [
        '....DDDD.DDDD...',
        '...DGGGGDGGGGD..',
        '..DGGGGGGGGGGD..',
        '..DGWWWBBWWBBD..',
        '..DGWWWBBWWBBD..',
        '.DGGGWWWGWWWGGD.',
        '.DGGGGGGGGGGGGD.',
        '.DGGMMMMMMMMMMD.',
        '..DGGMMMMMMMMD..',
        '...DGGGGGGGGD...',
    ],
    [
        '....DDDD.DDDD...',
        '...DGGGGDGGGGD..',
        '..DGGGGGGGGGGD..',
        '..DGWWWWWWWWWD..',
        '..DGWWWBBWWBBD..',
        '.DGGGTWWGTWWGGD.',
        '.DGGGTGGGTGGGGD.',
        '.DGGGGMMMMMMGGD.',
        '..DGGMMGGGGMMD..',
        '...DGMGGGGGGD...',
    ],
    [
        '....DDDD.DDDD...',
        '...DGGGGDGGGGD..',
        '..DGGGGGGGGGGD..',
        '..DGDDDDGDDDDD..',
        '..DGGTGGGGTGGD..',
        '.DGGGTGGGGTGGGD.',
        '.DGGGTMMMMTMGGD.',
        '.DGGMTRRRRTMMGD.',
        '..DGGTRPPRTMD...',
        '...DGTMMMMTD....',
    ],
];
// 몸통 (옷) : 모든 얼굴에 공통
const BODY = [
    '....UUUUUUUUG...',
    '...UUUUUUUUUUG..',
    '..GUUUUUUUUUVG..',
    '...UUUUUUUUUV...',
    '...UUUUUUUUVV...',
    '...VUUUUUUUV....',
];
// 다리 : 달릴 때 두 장 번갈아 · 점프 중엔 JUMP
const LEGS_A    = ['...VV....VV.....', '...VV.....VV....'];
const LEGS_B    = ['....VV..VV......', '.....VV.VV......'];
const LEGS_JUMP = ['...VV...VV......', '..VV.....VV.....'];

// 장애물
const BANANA = [
    '......O.',
    '.....YY.',
    '....YYY.',
    'Y..YYY..',
    'YYYYY...',
    '.YYY....',
];
const PUDDLE = [
    '..AAAAAAAAAA..',
    '.AALLAAAAAAAA.',
    'AAAAAAAALLAAAA',
];
const CONE = [
    '....CC....',
    '....CC....',
    '...CEEC...',
    '...CCCC...',
    '..CCCCCC..',
    '..CEEEEC..',
    '.CCCCCCCC.',
    '.CCCCCCCC.',
    '.CEEEEEEC.',
    'CCCCCCCCCC',
    'KKKKKKKKKK',
    'KKKKKKKKKK',
];
const TRASH = [
    '...KKKK...',
    '.KKKKKKKK.',
    'KSSSSSSSSK',
    'KKKKKKKKKK',
    '.KSNSSNSK.',
    '.KSNSSNSK.',
    '.KSNSSNSK.',
    '.KSNSSNSK.',
    '.KSNSSNSK.',
    '.KSNSSNSK.',
    '.KSNSSNSK.',
    '.KSSSSSSK.',
    '..KKKKKK..',
];
const HEART = [
    '.HH.HH.',
    'HHHHHHH',
    'HHHHHHH',
    '.HHHHH.',
    '..HHH..',
    '...H...',
];

/* ▼ 게임 설정 */
const PX = 4;               // 픽셀 한 칸 = 화면 4px (캔버스 기준)
const LIVES = 3;            // 멘탈 하트 개수
const GRAVITY = 2200;       // 떨어지는 힘
const JUMP = 640;           // 점프 힘
const SPEED_START = 360;    // 처음 달리는 속도 (px/초)
const SPEED_MAX = 780;      // 최대 속도
const SPEED_UP = 10;        // 1초마다 빨라지는 양
const GAP_MIN = 0.7, GAP_MAX = 1.4;   // 장애물 사이 간격 (초 단위 : 0.7 ~ 1.4초마다 하나)
const DOUBLE = 0.3;         // 장애물 두 개가 붙어서 나올 확률 (0 ~ 1)
const HURT_SEC = 1;         // 부딪힌 뒤 무적 시간 (깜빡깜빡)

/* =========================================================
   그림 미리 만들기 (픽셀 지도 → 작은 캔버스)
   ========================================================= */
function sprite(rows) {
    const c = document.createElement('canvas');
    c.width = rows[0].length * PX;
    c.height = rows.length * PX;
    const g = c.getContext('2d');
    rows.forEach((row, y) => [...row].forEach((ch, x) => {
        if (!COLORS[ch]) return;
        g.fillStyle = COLORS[ch];
        g.fillRect(x * PX, y * PX, PX, PX);
    }));
    return c;
}
// 얼굴마다 달리기 두 장 + 점프 자세
const PEPE = FACES.map(face => ({
    runA: sprite([...face, ...BODY, ...LEGS_A]),
    runB: sprite([...face, ...BODY, ...LEGS_B]),
    jump: sprite([...face, ...BODY, ...LEGS_JUMP]),
}));
const IMG = {
    heart: sprite(HEART),
};
// 장애물 : 같은 그림을 여러 번 넣으면 그만큼 자주 나옴 (키 큰 꼬깔·쓰레기통이 더 자주)
const OBSTACLES = [BANANA, PUDDLE, CONE, CONE, TRASH, TRASH].map(sprite);

/* =========================================================
   게임
   ========================================================= */
const canvas = document.getElementById('runner-canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND = H - 28;                 // 땅 높이 (페페 발 위치)
const isMuted = () => typeof muted !== 'undefined' && muted;   // 사이트에선 script.js 의 소리 끄기를 따라감

let state = 'ready';   // ready → play → over
let pepe, obstacles, speed, dist, lives, hurt, nextGap, groundX, best = 0, last = 0;

function reset() {
    pepe = { x: 60, y: GROUND, vy: 0 };
    obstacles = [];
    speed = SPEED_START;
    dist = 0;
    lives = LIVES;
    hurt = 0;
    nextGap = 250;
    groundX = 0;
}

function jump() {
    if (state !== 'play') { reset(); state = 'play'; return; }
    if (pepe.y >= GROUND) { pepe.vy = -JUMP; beep(520, .08); }
}

function update(dt) {
    if (state !== 'play') return;

    speed = Math.min(SPEED_MAX, speed + SPEED_UP * dt);
    dist += speed * dt / 40;           // 화면 40px = 1m
    groundX = (groundX + speed * dt) % 24;
    if (hurt > 0) hurt -= dt;

    // 점프
    pepe.vy += GRAVITY * dt;
    pepe.y = Math.min(GROUND, pepe.y + pepe.vy * dt);
    if (pepe.y >= GROUND) pepe.vy = 0;

    // 장애물 : 일정 시간마다 하나씩 · 가끔 두 개가 딱 붙어서 (한 번에 넘어야 함)
    nextGap -= speed * dt;
    if (nextGap <= 0) {
        const pick = () => OBSTACLES[Math.floor(Math.random() * OBSTACLES.length)];
        const img = pick();
        obstacles.push({ img, x: W, hit: false });
        if (Math.random() < DOUBLE) obstacles.push({ img: pick(), x: W + img.width + 4, hit: false });
        nextGap = speed * (GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN));
    }
    obstacles.forEach(o => o.x -= speed * dt);
    obstacles = obstacles.filter(o => o.x + o.img.width > 0);

    // 부딪힘 (그림보다 조금 작은 상자로 판정해서 억울하지 않게)
    const pw = PEPE[0].runA.width;
    const px1 = pepe.x + 12, px2 = pepe.x + pw - 16, py2 = pepe.y;
    obstacles.forEach(o => {
        if (o.hit || hurt > 0) return;
        const ox1 = o.x + 4, ox2 = o.x + o.img.width - 4, oy1 = GROUND - o.img.height + 4;
        if (px2 > ox1 && px1 < ox2 && py2 > oy1) {
            o.hit = true;
            lives--;
            hurt = HURT_SEC;
            beep(160, .25, 'square');
            if (lives <= 0) {
                state = 'over';
                best = Math.max(best, Math.floor(dist));
            }
        }
    });
}

/* =========================================================
   그리기
   ========================================================= */
function text(str, x, y, size, color = '#222', align = 'center') {
    ctx.font = `${size}px "DotGothic16", "Pixelify Sans", sans-serif`;
    ctx.textAlign = align;
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
}

function draw(t) {
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#fbfbf6';
    ctx.fillRect(0, 0, W, H);

    // 땅 : 선 + 흘러가는 점
    ctx.fillStyle = '#555';
    ctx.fillRect(0, GROUND, W, 2);
    ctx.fillStyle = '#aaa';
    for (let x = -groundX; x < W; x += 24) ctx.fillRect(x, GROUND + 8 + (x * 7 % 3) * 4, 8, 2);

    // 장애물
    obstacles.forEach(o => ctx.drawImage(o.img, Math.round(o.x), GROUND - o.img.height));

    // 페페 : 잃은 하트만큼 얼굴이 일그러진 채로 유지 (끝나면 가장 많이 우는 얼굴)
    //        땅에서는 다리 두 장 번갈아, 공중에선 점프 자세
    const face = PEPE[Math.round((LIVES - lives) / LIVES * (PEPE.length - 1))];
    let img = pepe.y < GROUND ? face.jump : (Math.floor(t / 110) % 2 ? face.runA : face.runB);
    if (state === 'over') img = face.jump;
    if (state === 'ready') img = face.runA;
    const blink = hurt > 0 && state === 'play' && Math.floor(t / 80) % 2;
    if (!blink) ctx.drawImage(img, pepe.x, Math.round(pepe.y - img.height));

    // 멘탈 (하트) · 거리
    for (let i = 0; i < LIVES; i++) {
        ctx.globalAlpha = i < lives ? 1 : 0.18;
        ctx.drawImage(IMG.heart, 14 + i * 34, 12);
    }
    ctx.globalAlpha = 1;
    text(`${Math.floor(dist)}m`, W - 14, 32, 22, '#222', 'right');
    if (best) text(`최고 ${best}m`, W - 14, 52, 14, '#888', 'right');

    // 안내 글
    if (state === 'ready') {
        text('출근길 페페', W / 2, H * 0.36, 30);
        text('스페이스 / 클릭 = 점프', W / 2, H * 0.36 + 30, 16, '#555');
    }
    if (state === 'over') {
        text(`오늘도 지각… ${Math.floor(dist)}m`, W / 2, H * 0.36, 28, '#c00');
        text('스페이스 / 클릭 = 다시', W / 2, H * 0.36 + 30, 16, '#555');
    }
}

function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    update(dt);
    draw(t);
    requestAnimationFrame(frame);
}

/* =========================================================
   소리 (파일 없이 짧은 삑 소리)
   ========================================================= */
let ac = null;
function beep(freq, dur, type = 'triangle') {
    if (isMuted()) return;
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * (type === 'square' ? 0.5 : 1.6), ac.currentTime + dur);
    g.gain.setValueAtTime(0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
}

/* =========================================================
   조작
   ========================================================= */
addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); if (!e.repeat) jump(); }
});
canvas.addEventListener('pointerdown', jump);

reset();
document.fonts.ready.then(() => requestAnimationFrame(t => { last = t; frame(t); }));
})();
</script>
</body>
</html>
